<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ORA Lakeview Hotel | Scenic Swiss Alps & Lake View Stay</title>

    content="Wake up to breathtaking lake and mountain views at ORA Lakeview Hotel in Switzerland." />

  <!-- Google Fonts: Cinzel for Headings & Didact Gothic for Body Text -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Didact+Gothic&display=swap"

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>

      theme: {
        extend: {
          fontFamily: {
            sans: ['"Didact Gothic"', 'sans-serif'],
            serif: ['Cinzel', 'serif'],
            cinzel: ['Cinzel', 'serif'],
            didact: ['"Didact Gothic"', 'sans-serif'],
          },
          colors: {
            primary: '#0f172a',
            amberGold: '#d4af37',
          }
        }
      }
    }

</head>

<body class="bg-slate-950 text-white antialiased selection:bg-amber-400 selection:text-slate-950">

  <script type="module" src="/src/main.tsx"></script>
